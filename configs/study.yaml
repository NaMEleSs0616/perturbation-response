representation_models: [ridge, mlp_ensemble]

learning_curve:
  datasets: [replogle2022_k562_essential, replogle2022_rpe1]
  sizes: [25, 50, 100, 200, 400, 800]
  repeats: 3

cross_context: [replogle2022_k562_essential, replogle2022_rpe1]
