# Dataset registry. Each entry describes ONE file of a public perturbation dataset.
# `validation_status` is updated in data/raw/<id>/validation.json by `datasets validate`,
# not here; the value below is the status at the time this registry was written.
# Downloads are never triggered implicitly. Large files require --allow-large.

defaults:
  zenodo_record: "13350497"          # scPerturb RNA/protein archive, version 1.4
  zenodo_concept_doi: "10.5281/zenodo.7041848"
  archive_license: "CC-BY-4.0 (Zenodo record for the harmonised h5ad files)"
  max_default_download_mb: 800

datasets:
  norman2019:
    name: "Norman et al. 2019 - K562 CRISPRa single and pairwise perturbations"
    publication: "Norman TM, Horlbeck MA, Replogle JM, et al. Exploring genetic interaction manifolds constructed from rich single-cell phenotypes. Science 365:786-793 (2019). doi:10.1126/science.aax4438"
    source_url: "https://zenodo.org/records/13350497"
    accession: "GEO GSE133344"
    doi: "10.5281/zenodo.13350497"
    file: "NormanWeissman2019_filtered.h5ad"
    download_url: "https://zenodo.org/api/records/13350497/files/NormanWeissman2019_filtered.h5ad/content"
    md5: "c870e6967d91c017d9da827bab183cd6"
    size_mb: 698.7
    download_instructions: "python -m biophysical.cli datasets download norman2019"
    license: "Harmonised file: CC-BY-4.0 (scPerturb Zenodo). Original GEO deposit: NCBI GEO data are publicly available; see https://www.ncbi.nlm.nih.gov/geo/info/disclaimer.html and cite the original study."
    organism: "Homo sapiens"
    assay: "Perturb-seq (10x Genomics 3' scRNA-seq), CRISPRa"
    cell_context: "K562 (chronic myelogenous leukaemia cell line)"
    perturbation_types: ["CRISPRa single-gene", "CRISPRa two-gene combination"]
    expected_obs_fields: ["perturbation", "perturbation_type", "nperts", "ncounts", "ngenes"]
    control_label: "control"
    role: "primary_benchmark"
    preprocessing_config: "configs/benchmark_norman.yaml"
    validation_status: "pending_download"

