[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biophysical"
version = "0.1.0"
description = "Perturbation-response prediction, uncertainty and experiment prioritisation on public single-cell perturbation data"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "anndata>=0.10",
  "h5py>=3.9",
  "torch>=2.1",
  "pyyaml>=6.0",
  "requests>=2.31",
  "altair>=5",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["biophysical*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: test requires internet access (skipped unless BIOPHYSICAL_NETWORK_TESTS=1)",
  "realdata: test requires the downloaded Norman 2019 dataset",
]
